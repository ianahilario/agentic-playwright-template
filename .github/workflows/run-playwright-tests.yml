name: Run Playwright tests

on:
  workflow_call:
    inputs:
      suite:
        description: smoke or full
        required: true
        type: string
    secrets:
      USER_DEFAULT_EMAIL:
        required: true
      USER_DEFAULT_PASSWORD:
        required: true
      USER_SIGNUP_EMAIL:
        required: true
      USER_SIGNUP_PASSWORD:
        required: true
  workflow_dispatch:
    inputs:
      suite:
        description: smoke or full test suite
        required: true
        type: choice
        options:
          - smoke
          - full

jobs:
  test:
    continue-on-error: ${{ inputs.suite == 'smoke' }}
    timeout-minutes: ${{ inputs.suite == 'full' && 120 || 60 }}
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.62.1-noble
      options: --user 1001
    steps:
      - uses: actions/checkout@v4
      - name: Write env file
        env:
          USER_DEFAULT_EMAIL: ${{ secrets.USER_DEFAULT_EMAIL }}
          USER_DEFAULT_PASSWORD: ${{ secrets.USER_DEFAULT_PASSWORD }}
          USER_SIGNUP_EMAIL: ${{ secrets.USER_SIGNUP_EMAIL }}
          USER_SIGNUP_PASSWORD: ${{ secrets.USER_SIGNUP_PASSWORD }}
        run: |
          {
            printf 'USER_DEFAULT_EMAIL=%s\n' "$USER_DEFAULT_EMAIL"
            printf 'USER_DEFAULT_PASSWORD=%s\n' "$USER_DEFAULT_PASSWORD"
            printf 'USER_SIGNUP_EMAIL=%s\n' "$USER_SIGNUP_EMAIL"
            printf 'USER_SIGNUP_PASSWORD=%s\n' "$USER_SIGNUP_PASSWORD"
          } > .env.secret
      - name: Install dependencies
        env:
          HUSKY: '0'
        run: npm ci
      - name: Run Playwright tests
        run: npx playwright test ${{ inputs.suite == 'smoke' && '--grep @smoke' || '' }}
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report-${{ inputs.suite }}
          path: playwright-report/
          retention-days: 30
