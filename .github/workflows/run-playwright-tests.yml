name: Run Playwright tests

on:
  workflow_call:
    inputs:
      suite:
        description: smoke, changed, or full
        required: true
        type: string
      fail-on-test-failure:
        description: Fail the run when Playwright does not pass
        required: true
        type: boolean
    outputs:
      passed:
        description: Tests that passed without a retry
        value: ${{ jobs.test.outputs.passed }}
      failed:
        description: Tests that failed
        value: ${{ jobs.test.outputs.failed }}
      skipped:
        description: Tests that were skipped
        value: ${{ jobs.test.outputs.skipped }}
      flaky:
        description: Tests that failed and then passed on retry
        value: ${{ jobs.test.outputs.flaky }}
      total:
        description: Passed, failed, skipped, and flaky tests
        value: ${{ jobs.test.outputs.total }}
      report_found:
        description: true when Playwright wrote the JSON report
        value: ${{ jobs.test.outputs.report_found }}
    secrets:
      USER_PASSWORD:
        required: true
  workflow_dispatch:
    inputs:
      suite:
        description: smoke, changed, or full test suite
        required: true
        type: choice
        options:
          - smoke
          - changed
          - full
      fail-on-test-failure:
        description: Fail the run when Playwright does not pass
        required: true
        type: boolean
        default: true

jobs:
  test:
    name: Run Playwright
    continue-on-error: ${{ inputs['fail-on-test-failure'] == false }}
    timeout-minutes: ${{ inputs.suite == 'full' && 120 || 60 }}
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.62.1-noble
      options: --user 1001
    outputs:
      passed: ${{ steps.summary.outputs.passed }}
      failed: ${{ steps.summary.outputs.failed }}
      skipped: ${{ steps.summary.outputs.skipped }}
      flaky: ${{ steps.summary.outputs.flaky }}
      total: ${{ steps.summary.outputs.total }}
      report_found: ${{ steps.summary.outputs.report_found }}
      tests_failed: ${{ steps.playwright.outcome == 'failure' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: ${{ inputs.suite == 'changed' && '0' || '1' }}
      - name: Write env file
        env:
          USER_PASSWORD: ${{ secrets.USER_PASSWORD }}
        run: printf 'USER_PASSWORD=%s\n' "$USER_PASSWORD" > .env.secret
      - name: Install dependencies
        env:
          HUSKY: '0'
        run: npm ci
      - name: Run Playwright tests
        id: playwright
        continue-on-error: true
        env:
          SUITE: ${{ inputs.suite }}
          BASE_REF: ${{ github.base_ref }}
          BEFORE_SHA: ${{ github.event.before }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          if [ "$SUITE" = "smoke" ]; then
            npx playwright test --grep @smoke
          elif [ "$SUITE" != "changed" ]; then
            npx playwright test
          else
            if [ -n "$BASE_REF" ]; then
              base="origin/${BASE_REF}"
            elif [ -n "$BEFORE_SHA" ] && [ "$BEFORE_SHA" != "0000000000000000000000000000000000000000" ]; then
              base="$BEFORE_SHA"
            else
              base="origin/${DEFAULT_BRANCH:-main}"
            fi

            list_file="$(mktemp)"
            npx playwright-smart-runner --list --base "$base" > "$list_file"
            if [ ! -s "$list_file" ]; then
              mkdir -p test-results
              printf '%s\n' '{"stats":{"expected":0,"unexpected":0,"skipped":0,"flaky":0}}' > test-results/results.json
              echo "No changed tests to run." >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi

            echo "Tests selected for this change:"
            cat "$list_file"
            set --
            while IFS= read -r test || [ -n "$test" ]; do
              [ -n "$test" ] || continue
              set -- "$@" "$test"
            done < "$list_file"
            npx playwright test "$@"
          fi
      - name: Publish test counts
        id: summary
        if: always()
        run: |
          node <<'EOF'
          const fs = require('node:fs');

          const reportPath = 'test-results/results.json';
          const lines = [];

          function add(name, value) {
            lines.push(`${name}=${value}`);
          }

          function writeSummary(markdown) {
            fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, markdown);
          }

          let stats;
          try {
            stats = JSON.parse(fs.readFileSync(reportPath, 'utf8')).stats;
          } catch {
            stats = undefined;
          }

          if (!stats) {
            add('passed', '0');
            add('failed', '0');
            add('skipped', '0');
            add('flaky', '0');
            add('total', '0');
            add('report_found', 'false');
            fs.appendFileSync(process.env.GITHUB_OUTPUT, `${lines.join('\n')}\n`);
            writeSummary('Playwright did not write a JSON report.\n');
            process.exit(0);
          }

          function num(value) {
            return Number.isInteger(value) ? value : 0;
          }

          const passed = num(stats.expected);
          const failed = num(stats.unexpected);
          const skipped = num(stats.skipped);
          const flaky = num(stats.flaky);
          const total = passed + failed + skipped + flaky;

          add('passed', String(passed));
          add('failed', String(failed));
          add('skipped', String(skipped));
          add('flaky', String(flaky));
          add('total', String(total));
          add('report_found', 'true');
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `${lines.join('\n')}\n`);

          writeSummary(
            [
              '### Playwright',
              '',
              '| Result | Count |',
              '| --- | ---: |',
              `| Passed | ${passed} |`,
              `| Failed | ${failed} |`,
              `| Skipped | ${skipped} |`,
              `| Passed on retry | ${flaky} |`,
              `| Total | ${total} |`,
              '',
            ].join('\n'),
          );
          EOF
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report-${{ inputs.suite }}
          path: playwright-report/
          if-no-files-found: warn
          retention-days: 30

  result:
    name: Test result
    needs: test
    if: always() && needs.test.result != 'cancelled'
    continue-on-error: ${{ inputs['fail-on-test-failure'] == false }}
    runs-on: ubuntu-latest
    steps:
      - name: Fail when tests fail
        if: needs.test.result != 'success' || needs.test.outputs.tests_failed == 'true' || needs.test.outputs.report_found != 'true'
        run: |
          echo "::error::passed=${{ needs.test.outputs.passed }} failed=${{ needs.test.outputs.failed }} skipped=${{ needs.test.outputs.skipped }} flaky=${{ needs.test.outputs.flaky }} report_found=${{ needs.test.outputs.report_found }}"
          exit 1
