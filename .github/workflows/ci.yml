name: CI

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    name: Smoke tests
    if: github.event_name == 'push' || github.event.pull_request.draft == false
    uses: ./.github/workflows/run-playwright-tests.yml
    with:
      suite: smoke
    secrets: inherit
