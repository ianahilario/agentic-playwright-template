name: Nightly

on:
  schedule:
    - cron: '0 0 * * *'
      timezone: Asia/Hong_Kong

jobs:
  full-suite:
    name: Full test suite
    permissions:
      actions: write
      contents: read
      issues: write
    uses: ./.github/workflows/run-playwright-tests.yml
    with:
      suite: full
      fail-on-test-failure: true
    secrets: inherit
